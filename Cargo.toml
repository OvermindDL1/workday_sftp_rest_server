[package]
name = "workday_sftp_rest_server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
axum = { version = "0.5.16", features = ["headers", "http2", "macros", "multipart", "ws"] }
axum-server = { version = "0.4.2", features = ["tls-rustls"] }
axum-auth = "0.3.0"
chrono = { version = "0.4.22", features = ["serde"] }
clap = { version = "4.0.0-rc.1", features = ["derive"] }
csv = "1.1"
glob = "0.3"
hyper = { version = "0.14.20", features = ["full"] }
oracle = { version = "0.5.6", features = ["chrono"] }
r2d2-oracle = { version = "0.5.0", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
sha2 = "0.10.6"
tokio = { version = "1.21", features = ["full"] }
tower = "0.4.13"
tracing = "0.1.36"
tracing-subscriber = { version = "0.3.15", features = ["json", "env-filter", "registry"] }